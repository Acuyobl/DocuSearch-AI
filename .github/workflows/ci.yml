name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Permisos mínimos: el flujo solo necesita leer el repositorio.
permissions:
  contents: read

jobs:
  compilacion-y-checks:
    name: Compilación y checks
# Windows: la aplicación y la suite están pensadas para Windows (SQL Server, autenticación
# de Windows, rutas del worker Python). Los 87 checks sin servicios también corren aquí.
    runs-on: windows-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore DocuSearch.sln

      - name: Compilar en Release
        run: dotnet build DocuSearch.sln --no-restore -c Release

      # Los checks se compilan y ejecutan en Debug para que la suite use la misma
      # configuración de desarrollo documentada en el README.
      - name: Ejecutar checks
        run: dotnet run --project tests/DocuSearch.Checks.csproj -c Debug

      # AG-02: verificador determinista de citas, fuentes y páginas. No usa red ni base.
      - name: Ejecutar checks del verificador AG-02
        run: dotnet run --project tests/DocuSearch.Checks.csproj -c Debug -- --verifier

      # AG-10: inspector determinista de calidad documental. No usa red ni base.
      - name: Ejecutar checks del inspector AG-10
        run: dotnet run --project tests/DocuSearch.Checks.csproj -c Debug -- --inspector

      # AG-01: parser determinista de la ficha propuesta por el Catalogador.
      - name: Ejecutar checks del catalogador AG-01
        run: dotnet run --project tests/DocuSearch.Checks.csproj -c Debug -- --catalog

      # AG-05: resumen determinista de riesgos de la bitácora.
      - name: Ejecutar checks del auditor AG-05
        run: dotnet run --project tests/DocuSearch.Checks.csproj -c Debug -- --audit

      # Gobernanza: bitácora con antes/después, doble control y rutinas.
      - name: Ejecutar checks de gobernanza
        run: dotnet run --project tests/DocuSearch.Checks.csproj -c Debug -- --governance

      # Consumo de IA: presupuesto, incidentes y registro de llamadas.
      - name: Ejecutar checks de consumo de IA
        run: dotnet run --project tests/DocuSearch.Checks.csproj -c Debug -- --ai

      # Endurecimiento: bloqueo temporal de login por cuenta.
      - name: Ejecutar checks de bloqueo de login
        run: dotnet run --project tests/DocuSearch.Checks.csproj -c Debug -- --auth

      # RAG híbrido: coseno, recuperación vectorial y serialización.
      - name: Ejecutar checks de RAG híbrido
        run: dotnet run --project tests/DocuSearch.Checks.csproj -c Debug -- --rag

      # LangGraph: seam ILangGraphRunner y pruebas con runner falso, sin Python ni red.
      - name: Ejecutar checks C# de LangGraph
        run: dotnet run --project tests/DocuSearch.Checks.csproj -c Debug -- --langgraph

      # MCP: hash determinista de tokens; no requiere SQL ni red.
      - name: Ejecutar checks MCP
        run: dotnet run --project tests/DocuSearch.Checks.csproj -c Debug -- --mcp

      # Verificación de higiene: los secretos TOTP viven en user-secrets, nunca en el repositorio.
      - name: Verificar que no haya secretos TOTP versionados
        shell: bash
        run: |
          set -e
          if grep -nE '"TotpSecret"[[:space:]]*:[[:space:]]*"[A-Z2-7]{16,}"' appsettings.json; then
            echo "::error::appsettings.json contiene secretos TOTP. Muévelos a dotnet user-secrets como Auth:TotpSecrets:<correo>."
            exit 1
          fi
          echo "OK: sin secretos TOTP versionados."

      # Verificación de higiene: las cuentas reales viven en user-secrets, no en el repositorio.
      - name: Verificar que no haya correos personales versionados
        shell: bash
        run: |
          set -e
          if git grep -nIiE '[A-Za-z0-9._%+-]+@(gmail|googlemail|hotmail|outlook|live|yahoo|icloud|proton|protonmail)\.[a-z.]+' -- . ':!LICENSE'; then
            echo "::error::Hay correos personales versionados. Usa cuentas @example.test y declara las reales en user-secrets (Auth:Users:N:Email)."
            exit 1
          fi
          echo "OK: sin correos personales versionados."

      # Verificación de higiene: los artefactos de compilación nunca deben versionarse.
      - name: Verificar que no haya bin/ u obj/ versionados
        shell: bash
        run: |
          set -e
          if git ls-files | grep -E '(^|/)(bin|obj)/'; then
            echo "::error::Hay artefactos bin/ u obj/ versionados. Elimínalos del repositorio."
            exit 1
          fi
          echo "OK: no hay bin/ u obj/ versionados."

# NOTA: la suite de integración con SQL Server NO se ejecuta en CI. Para lanzarla
# hace falta una instancia real de SQL Server y una base de datos exclusiva cuyo
# nombre termine en _tests, indicada en la variable DOCUSEARCH_TEST_CONNECTION:
#
#   dotnet run --project tests/DocuSearch.Checks.csproj -c Debug -- --database
#
# Por eso este flujo solo ejecuta los checks que funcionan sin base de datos.
